<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>네이비1945</title>
<meta name="description" content="네 나라 중 하나를 골라 프리깃에서 전함까지 키우는 3D 해전 로그라이트. 가로 화면 권장.">
<meta property="og:title" content="네이비1945 — 함대를 키워라">
<meta property="og:description" content="프리깃에서 전함까지, 포탑이 알아서 쏘는 3D 해전 키우기 게임">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bulls5857.github.io/navy1945/">
<meta property="og:image" content="https://bulls5857.github.io/navy1945/og.png?v=3">
<meta property="og:image:alt" content="노을 속에서 주포를 쏘는 전함 — NAVY1945 영화 포스터 패러디">
<meta property="og:site_name" content="NAVY1945">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B1820">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Pixelify+Sans:wght@400;500;600&family=Gothic+A1:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL harbor/sea. Port: controls top, upgrade list right, ship card + sortie bottom-left. Battle: HUD corners, joystick anywhere. Single dark look. */
:root{--ink:#0B1820;--chip:rgba(11,24,32,.82);--line:#2E4B5A;--fg:#E6EEF1;--mute:#9DB3BE;--accent:#F2A33A;--ok:#6FCB8E;--bad:#E2593F;
  --body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--num:'Chakra Petch','Gothic A1',sans-serif;color-scheme:dark}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.bar{position:fixed;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
.top{top:calc(8px + env(safe-area-inset-top,0px))}
.brand{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:700 15px var(--num);letter-spacing:.04em}
.brand span{color:var(--accent)}
.seg{pointer-events:auto;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mute);font:700 12px var(--body);padding:0 11px;min-height:38px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#1A1204}
.coin{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 10px;display:flex;align-items:center;gap:6px;font:700 15px var(--num);color:var(--accent)}
.coin i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,#d9a12a 60%,#8a5d0c);display:block}
.spacer{flex:1}
.mute{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:6px;color:var(--mute);font:700 12px var(--body);padding:0 10px;min-height:38px}
.mute[aria-pressed="true"]{color:var(--fg)}
.fs{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:700 12px var(--body);padding:0 10px;min-height:38px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(440px,92vw);background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:12px;line-height:1.5;text-align:center;z-index:30;transition:opacity .3s;pointer-events:none}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 55%,rgba(11,24,32,0) 30%,rgba(6,12,18,.82) 100%),linear-gradient(180deg,rgba(6,12,18,.75),rgba(6,12,18,0) 35%,rgba(6,12,18,0) 62%,rgba(6,12,18,.85));transition:opacity .45s}
#title .k{font:700 12px var(--body);letter-spacing:.5em;color:var(--accent);text-shadow:0 1px 6px rgba(0,0,0,.8);margin-right:-.5em}
#title h1{margin:0;font:700 clamp(46px,11vw,104px)/.95 var(--num);letter-spacing:.06em;color:#F3F6F7;text-shadow:0 3px 0 #0B1820,0 0 28px rgba(0,0,0,.65)}
#title h1 span{color:var(--accent)}
#title .rule{width:min(380px,60vw);height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:6px 0}
#title p{margin:0;font:700 15px var(--body);color:var(--fg);text-shadow:0 1px 6px rgba(0,0,0,.9)}
#title .tap{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--mute);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
body.titled #port{opacity:0;pointer-events:none}
#port{transition:opacity .45s}
#drawer{position:fixed;right:10px;top:calc(56px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(310px,46vw);transition:transform .32s ease;touch-action:pan-y}
#drawer.min{transform:translateX(calc(100% + 10px))}
#port .panel{height:100%;box-sizing:border-box;background:var(--chip);border:1px solid var(--line);border-radius:8px;overflow-y:auto;padding:4px 12px 10px}
.handle{position:absolute;left:-42px;top:50%;transform:translateY(-50%);width:36px;min-height:76px;border:1px solid var(--line);border-radius:8px 0 0 8px;background:var(--chip);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 12px var(--body);writing-mode:vertical-rl;letter-spacing:.1em;padding:8px 0}
.handle b{writing-mode:horizontal-tb;font-size:14px;transition:transform .32s}
#drawer.min .handle b{transform:rotate(180deg)}
#drawer.min .handle{left:-46px}
#port.wide .card{max-width:calc(100% - 70px)}
@media (prefers-reduced-motion:reduce){#drawer,.handle b{transition:none}}
.sec{font-size:10px;letter-spacing:.14em;color:var(--mute);margin:10px 0 2px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{font-weight:700;font-size:13px}
.nm em{font-style:normal;color:var(--accent);font:600 11px var(--num);margin-left:5px}
.ds{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.4}
.ds b{color:var(--fg);font-weight:700}
.pips{display:flex;gap:2px;margin-top:4px}.pips i{width:12px;height:4px;border-radius:1px;background:var(--line)}.pips i.on{background:var(--accent)}
.buy{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:5px;padding:6px 9px;font:700 12px var(--num);min-width:64px;min-height:34px}
.buy.big{background:var(--accent);color:#1A1204}
.tag{font-size:11px;color:var(--ok);font-weight:700}
.card{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:none;max-width:calc(100% - min(310px,46vw) - 30px)}
.info{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.info b{font-size:14px;display:block}
.info span{font-size:11px;color:var(--mute);display:block;margin-top:2px}
.info em{font-style:normal;font-family:var(--num);color:var(--fg)}
.go{pointer-events:auto;border:0;border-radius:8px;background:var(--accent);color:#1A1204;font:700 16px var(--body);padding:0 22px;min-height:54px;white-space:nowrap}
.go small{display:block;font:600 11px var(--num);opacity:.8}
#hud .hp{pointer-events:none;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.hp small{font-size:10px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.hp small b{font:600 11px var(--num);color:var(--fg)}
.meter{height:8px;border-radius:4px;background:#13262F;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);transition:width .15s}
.meter i.low{background:var(--bad)}
.stage{pointer-events:none;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-align:center;min-width:180px}
.stage b{font-size:13px;display:block}.stage span{font-size:11px;color:var(--mute)}
.stage .meter{margin-top:4px;height:5px}.stage .meter i{background:var(--accent)}
.stage.boss .meter i{background:var(--bad)}
.home{pointer-events:auto;position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 14px;min-height:40px;font-size:12px;color:var(--mute)}
.hint{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:12px;color:var(--mute);white-space:nowrap;pointer-events:none}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(230,238,241,.35);background:rgba(11,24,32,.25);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(242,163,58,.75)}
#banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);font:700 24px var(--body);color:var(--fg);text-shadow:0 2px 10px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap;transition:opacity .4s;opacity:0}
#result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,14,20,.6);padding:16px}
.res{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(360px,100%);display:flex;flex-direction:column;gap:6px}
.res h2{margin:0 0 6px;font-size:24px}.res h2.win{color:var(--accent)}.res h2.lose{color:var(--bad)}
.res .r{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:5px 0;border-bottom:1px solid var(--line)}
.res .r b{font-family:var(--num);color:var(--fg)}
.res .go{margin-top:10px;width:100%}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.6}
@media (max-width:920px){#port .brand{display:none}}
@media (max-width:640px){.seg button{padding:0 8px;font-size:11px}.brand{font-size:13px}}

.pchip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 10px 0 6px;min-height:38px;color:var(--fg);font:700 12px var(--body)}
.pchip .ins,.ins{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 4px;border-radius:4px;background:#1d3442;border:1px solid #4b6b7c;color:var(--accent);font:700 11px var(--num);letter-spacing:-.04em}
.pchip small{color:var(--mute);font-weight:400}
.modal{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(6,14,20,.66);padding:12px}
.sheet{background:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(620px,100%);max-height:100%;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sheet header{display:flex;align-items:center;gap:12px}
.sheet header .ins{min-width:48px;height:48px;font-size:16px;border-radius:8px}
.sheet h2{margin:0;font-size:20px}.sheet h2 small{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:2px}
.sheet .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);min-width:40px;min-height:40px;font-size:16px}
.namebox{display:flex;gap:8px;align-items:center}
.namebox input{flex:1;min-width:0;background:#10222c;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:700 15px var(--body);padding:0 10px;min-height:40px}
.namebox label{font-size:12px;color:var(--mute);white-space:nowrap}
.xp small{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:4px}
.xp .meter{height:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.grid div{background:#10222c;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:11px;color:var(--mute)}
.grid b{display:block;font:700 17px var(--num);color:var(--fg);margin-top:2px}
.ranks{display:flex;flex-wrap:wrap;gap:4px}
.ranks span{font-size:10px;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.ranks span.on{border-color:var(--accent);color:var(--accent)}.ranks span.now{background:var(--accent);color:#1A1204;border-color:var(--accent)}
.sheet .go{width:100%;min-height:48px}
.cardimg{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.note{font-size:12px;color:var(--mute);line-height:1.5;margin:0}
.res .up{color:var(--accent);font-weight:700;font-size:14px;text-align:center;padding:6px 0}

.namebox button,.mini{pointer-events:auto;background:#1d3442;border:1px solid #4b6b7c;border-radius:6px;color:var(--fg);font:700 12px var(--body);padding:0 12px;min-height:40px;white-space:nowrap}
.olbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:#0e1f28}
.olbox h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.olbox h3 i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}.olbox h3 i.ok{background:var(--ok)}.olbox h3 i.err{background:var(--bad)}
.code{font:700 18px var(--num);letter-spacing:.12em;color:var(--accent)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 input,.olbox textarea{flex:1;min-width:120px;background:#10222c;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:700 14px var(--body);padding:0 10px;min-height:40px}
.olbox textarea{min-height:64px;padding:8px 10px;font:400 11px/1.4 monospace;resize:vertical;width:100%;box-sizing:border-box}
.err{color:var(--bad);font-size:12px;margin:0}
.runs{display:flex;flex-direction:column}
.runs div{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;font-size:12px;color:var(--mute);padding:6px 0;border-bottom:1px solid var(--line)}
.runs b{color:var(--fg);font-family:var(--num)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mute);font:700 12px var(--body);padding:0 12px;min-height:36px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#1A1204}
.lb{display:flex;flex-direction:column}
.lb div{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px}
.lb div.me{background:rgba(242,163,58,.12)}
.lb .n{font:700 15px var(--num);color:var(--mute);text-align:right}.lb div:nth-child(-n+3) .n{color:var(--accent)}
.lb .who small{display:block;font-size:11px;color:var(--mute)}
.lb .v{font:700 16px var(--num)}
.rk{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:6px;color:var(--accent);font:700 12px var(--body);padding:0 12px;min-height:38px}

/* ---- reference look: navy panels, light-blue hairlines, pixel type ---- */
:root{--ink:#0a1830;--chip:rgba(9,22,44,.9);--line:#2f5d86;--hi:#7fb2e0;--fg:#e8f0f7;--mute:#9ab4cc;--num:'Pixelify Sans','Gothic A1',sans-serif}
body{background:var(--ink)}
.brand,.info,#port .panel,.coin,.seg,.pchip,.rk,.fs,.mute,.hp,.stage,.home,.sheet,.res{box-shadow:inset 0 0 0 1px rgba(127,178,224,.12)}
.brand{font:600 17px var(--num);letter-spacing:.06em}
.sec{font:500 11px var(--num);letter-spacing:.12em;color:var(--hi);text-transform:uppercase}
.info{padding:9px 12px 10px;max-width:330px}
.spec{display:flex;gap:10px;align-items:flex-start}
.spec img{width:42px;height:28px;image-rendering:pixelated;border:1px solid var(--line);flex:none;margin-top:3px}
.spec h3{margin:0;font:600 22px/1 var(--num);letter-spacing:.06em;color:#f3f8fc;text-transform:uppercase}
.spec .sub{font:400 12px var(--num);color:var(--mute);margin-top:3px;display:block}
.stats{display:grid;grid-template-columns:auto auto;column-gap:14px;margin-top:6px;font:400 12px/1.5 var(--num);color:var(--fg)}
.stats span{color:var(--mute);margin:0;display:inline}
.info .ko{font-size:11px;color:var(--mute);display:block;margin-top:5px;border-top:1px solid var(--line);padding-top:5px}
.pixbtn{pointer-events:auto;background:var(--chip);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:700 12px var(--body);padding:0 10px;min-height:38px}
.pixbtn[aria-pressed="true"]{color:var(--hi);border-color:var(--hi)}

#hud .home{position:static;min-height:38px}
#mini{position:fixed;right:10px;top:calc(58px + env(safe-area-inset-top,0px));width:118px;height:118px;border-radius:50%;border:1px solid var(--line);background:rgba(6,18,38,.72);box-shadow:inset 0 0 0 1px rgba(127,178,224,.15);pointer-events:none;image-rendering:pixelated}
#joy{opacity:.55;transition:opacity .15s}#joy.on{opacity:1}
.acts{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end}
.act{position:relative;width:74px;height:74px;border-radius:50%;border:2px solid var(--line);background:rgba(9,22,44,.86);color:var(--fg);font:700 12px/1.15 var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;overflow:hidden}
.act.big{width:88px;height:88px;border-color:var(--accent)}
.act b{font:600 18px var(--num);color:var(--accent)}
.act:disabled{font-size:11px;white-space:nowrap}
.act .cd{position:absolute;inset:0;background:conic-gradient(rgba(4,10,20,.78) var(--p,0%),transparent 0);pointer-events:none}
.act:disabled{opacity:.45}
.act.ready{box-shadow:0 0 0 3px rgba(242,163,58,.35)}
.act.on{border-color:var(--ok);box-shadow:0 0 0 3px rgba(111,203,142,.35)}
</style>

</head>
<body>
<canvas id="c" aria-label="3D 해전 화면"></canvas>
<div id="title" role="button" tabindex="0" aria-label="게임 시작">
  <div class="k">PACIFIC · ATLANTIC · NORTH SEA</div>
  <h1>NAVY<span>1945</span></h1>
  <div class="rule"></div>
  <p>프리깃에서 전함까지, 함대를 키워라</p>
  <div class="tap">화면을 눌러 시작 · 가로 화면 권장</div>
</div>
<div class="toast" id="toast" style="opacity:0"></div>
<div id="port">
  <div class="bar top">
    <div class="brand">NAVY<span>1945</span></div>
    <button type="button" class="pchip" id="pchip" aria-label="함장 프로필"></button>
    <button type="button" class="rk" id="rkBtn">랭킹</button>
    <div class="seg" role="group" aria-label="국가" id="natSeg"></div>
    <div class="spacer"></div>
    <button type="button" class="pixbtn" aria-pressed="true">도트 ON</button>
    <button type="button" class="fs">전체화면</button>
    <button type="button" class="mute" aria-pressed="true">소리 켜짐</button>
    <div class="coin"><i></i><span id="coinP">0</span></div>
  </div>
  <div id="drawer"><button type="button" class="handle" id="handle" aria-label="개장 창 접기" aria-expanded="true"><b>▶</b>개장</button><div class="panel" id="panel"></div></div>
  <div class="card"><div class="info" id="info"></div><button type="button" class="go" id="sortie">출격<small id="sortieSub">해역 1부터</small></button></div>
</div>
<div id="hud" hidden>
  <div class="bar top">

<script>

const errBox=document.getElementById('err');

const T=THREE,TAU=Math.PI*2,canvas=document.getElementById('c'),$=id=>document.getElementById(id);

const pq=new T.Mesh(new T.PlaneGeometry(2,2),new T.ShaderMaterial({uniforms:{tD:{value:prt.texture},uR:{value:new T.Vector2(2,2)}},depthTest:false,depthWrite:false,
  vertexShader:`varying vec2 vU;void main(){vU=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`uniform sampler2D tD;uniform vec2 uR;varying vec2 vU;
  float lu(vec3 c){return dot(c,vec3(.3,.59,.11));}
  float bay(vec2 p){vec2 q=mod(floor(p),4.);int i=int(q.x+q.y*4.);
    float m[16];m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
    for(int k=0;k<16;k++){if(k==i)return m[k]/16.-.47;}return 0.;}
  void main(){vec2 px=floor(vU*uR)+.5,e=1./uR;vec3 c=texture2D(tD,px*e).rgb;
    float l=lu(c),n=0.;
    n=max(n,lu(texture2D(tD,(px+vec2(1,0))*e).rgb)-l);n=max(n,lu(texture2D(tD,(px-vec2(1,0))*e).rgb)-l);
    n=max(n,lu(texture2D(tD,(px+vec2(0,1))*e).rgb)-l);n=max(n,lu(texture2D(tD,(px-vec2(0,1))*e).rgb)-l);
    c=mix(c,vec3(.02,.035,.08),smoothstep(.08,.2,n));
    c=mix(vec3(lu(c)),c,1.18);c=(c-.5)*1.06+.5;
    float lv=12.;c=floor(clamp(c,0.,1.)*lv+.5+bay(px)*.2)/lv;
    gl_FragColor=vec4(c,1.);}`}));

function drawFrame(){if(!PIX){camera.layers.mask=3;renderer.setRenderTarget(null);renderer.render(scene,camera);return}
  camera.layers.mask=1;
  const k=pixSize(),w=Math.max(2,Math.round(innerWidth/k)),h=Math.max(2,Math.round(innerHeight/k));
  if(prt.width!==w||prt.height!==h){prt.setSize(w,h);pq.material.uniforms.uR.value.set(w,h)}
  renderer.setRenderTarget(prt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(pScene,pCam);
  const bg=scene.background;scene.background=null;camera.layers.mask=2;renderer.autoClear=false;renderer.clearDepth();renderer.render(scene,camera);renderer.autoClear=true;camera.layers.mask=1;scene.background=bg}

vertexShader:`uniform float uTime,uAmp;varying vec3 vW;
void main(){vec4 w=modelMatrix*vec4(position,1.);float t=uTime;
w.y+=uAmp*(sin(w.x*.35+t*1.1)*.07+sin(w.z*.42-t*.9)*.06+sin((w.x+w.z)*.9+t*1.7)*.025);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform float uTime,uAmp,uNear,uFar;uniform vec3 uSun,uFog;varying vec3 vW;
void main(){vec2 p=vW.xz;float t=uTime;float fd=1.-smoothstep(18.,70.,length(cameraPosition-vW));
float dx=uAmp*(cos(p.x*.35+t*1.1)*.0245+cos((p.x+p.y)*.9+t*1.7)*.0225)+fd*(cos(p.x*2.3+p.y*1.1+t*2.6)*.03+cos(p.x*4.1-p.y*3.3+t*3.4)*.018+cos(p.x*9.-p.y*7.+t*5.)*.008);
float dz=uAmp*(cos(p.y*.42-t*.9)*.0252+cos((p.x+p.y)*.9+t*1.7)*.0225)+fd*(cos(p.y*2.7-p.x*.8+t*2.2)*.03+cos(p.y*5.2+p.x*2.9-t*3.1)*.016+cos(p.y*8.+p.x*6.-t*4.6)*.008);
vec3 n=normalize(vec3(-dx,1.,-dz));vec3 v=normalize(cameraPosition-vW);
float fr=pow(1.-max(dot(n,v),0.),4.);
vec3 deep=vec3(.004,.022,.07),shal=vec3(.012,.07,.17),sky=vec3(.16,.3,.5);
vec3 col=mix(deep,shal,clamp(.5+n.x*6.,0.,1.));col=mix(col,sky,fr*.75);

float d=length(cameraPosition-vW);col=mix(col,pow(uFog,vec3(2.2)),smoothstep(uNear,uFar,d));
gl_FragColor=vec4(col,1.);
#include <encodings_fragment>
}`}));
