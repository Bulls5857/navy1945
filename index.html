<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>네이비1945</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="네이비1945 — 함대를 키워라">
<meta property="og:description" content="프리깃에서 전함까지, 포탑이 알아서 쏘는 3D 해전 키우기 게임">
<meta property="og:type" content="website">
<meta property="og:url" content="https://navy1945.github.io/">
<meta property="og:image" content="https://navy1945.github.io/og.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="canonical" href="https://navy1945.github.io/">
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0a1830;color:#e8eef2;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;text-align:center}
h1{margin:0;font-size:22px}b{color:#f2a33a}p{margin:0;color:#9fb3c1;font-size:14px;line-height:1.6}
a{display:inline-block;margin-top:8px;padding:14px 26px;border-radius:8px;background:#f2a33a;color:#1a1204;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>⚓ 네이비1945가 새 주소로 이사했어요</h1>
<p><b>navy1945.github.io</b><br>저장된 함대와 기록을 그대로 가지고 이동하는 중이에요…</p>
<a id="go" href="https://navy1945.github.io/">새 주소로 바로 가기</a>
</main>
<script>
/* forwards every navy1945_* save key to the new address in the URL fragment (never sent to any server) */
(function(){var u='https://navy1945.github.io/'+(location.search||''),d={},n=0;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('navy1945_')===0){d[k]=localStorage.getItem(k);n++}}}catch(e){}
  if(n)try{u+='#mig='+btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_')}catch(e){}
  document.getElementById('go').href=u;setTimeout(function(){location.replace(u)},500)})();
</script>
</body>
</html>
